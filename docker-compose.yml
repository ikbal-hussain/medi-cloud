# `docker compose up -d postgres` (or `npm run db:up`): just PostgreSQL, for local development.
# `docker compose up --build`: the whole platform on http://localhost:8080. The API refuses to start without
# JWT_SECRET; put it in a .env file next to this one, e.g.  echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: medi
      POSTGRES_PASSWORD: medi
      POSTGRES_DB: medi_cloud
    # Loopback only: the well-known dev credentials must not be reachable from the network.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medi -d medi_cloud']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://medi:medi@postgres:5432/medi_cloud
      # Not `:?`: that would also block `docker compose up postgres`. Without it the API exits with a clear error.
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # nginx (the web container) is the one proxy in front: trust its X-Forwarded-For for client IPs.
      TRUST_PROXY: 1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health/db || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
