# Local development services. `docker compose up -d` starts PostgreSQL on localhost:5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: medi
      POSTGRES_PASSWORD: medi
      POSTGRES_DB: medi_cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medi -d medi_cloud"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
