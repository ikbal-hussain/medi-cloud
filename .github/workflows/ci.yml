name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medi
          POSTGRES_PASSWORD: medi
          POSTGRES_DB: medi_cloud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medi -d medi_cloud"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://medi:medi@localhost:5432/medi_cloud
      TEST_DATABASE_URL: postgresql://medi:medi@localhost:5432/medi_cloud_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Formatting (run `npm run format` to fix)
        run: npm run format:check
      - run: npm run typecheck
      - name: Migrations match the Prisma schema
        run: npm run db:check -w @medi-cloud/api
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medi
          POSTGRES_PASSWORD: medi
          POSTGRES_DB: medi_cloud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medi -d medi_cloud"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql://medi:medi@localhost:5432/medi_cloud_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker (whole platform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-secret-never-used-anywhere-else
    steps:
      - uses: actions/checkout@v7
      - name: Build and start database, migrations, API and web
        run: docker compose up --build --wait --wait-timeout 240
      - name: Load demo data with the tools image
        run: docker compose run --rm migrate npm run seed
      - name: Smoke test through the web container (nginx → API → PostgreSQL)
        shell: bash # -eo pipefail: a failed curl inside a pipe fails the step
        run: |
          curl -fsS http://localhost:8080/api/health/db
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          token=$(curl -fsS -X POST http://localhost:8080/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"nurse@city.com","password":"nurse123"}' | jq -er .token)
          curl -fsS http://localhost:8080/api/patients -H "Authorization: Bearer $token" | jq -e 'type == "array" and length > 0'
          curl -fsS -X POST http://localhost:8080/api/patients -H "Authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -d '{"name":"CI Test","age":30,"gender":"Other","type":"OPD","phoneNumber":"555-0199","address":"1 CI Road","admissionDate":"2026-11-28T10:00:00Z"}' \
            | jq -e '.name == "CI Test"'
      - name: Image sizes
        run: docker image ls --format '{{.Repository}} {{.Size}}' | grep -E 'api|web|migrate'
      - name: Logs
        if: failure()
        run: docker compose logs
