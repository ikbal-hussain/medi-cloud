name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medi
          POSTGRES_PASSWORD: medi
          POSTGRES_DB: medi_cloud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medi -d medi_cloud"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://medi:medi@localhost:5432/medi_cloud
      TEST_DATABASE_URL: postgresql://medi:medi@localhost:5432/medi_cloud_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations match the Prisma schema
        run: npm run db:check -w @medi-cloud/api
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medi
          POSTGRES_PASSWORD: medi
          POSTGRES_DB: medi_cloud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medi -d medi_cloud"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql://medi:medi@localhost:5432/medi_cloud_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
