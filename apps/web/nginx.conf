server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS, re-asked every 10 s, so recreating only the api container doesn't leave nginx on a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The API, on the same origin as the app.
  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Always revalidate the page itself, so a rebuild never leaves browsers on an index.html whose assets are gone.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: unknown paths get index.html and the client router takes over.
  location / {
    try_files $uri /index.html;
  }
}
